<!DOCTYPE html>

<head>

<title>Ascolta l'audio</title>

<style>
body {

    padding: 30px;
    font-family: Arial, sans-serif;

}

.player {
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

    margin-bottom: 20px;
}

audio {
    width: 100%;
}
</style>

</audio>

</div>
